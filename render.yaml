services:
  - type: web
    name: grounded-fruitful-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    domains:
      - api.groundedandfruitful.org
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CHILD_LOGIN_PEPPER
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
