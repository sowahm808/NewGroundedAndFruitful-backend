openapi: 3.1.0
info:
  title: Grounded & Fruitful API
  version: 1.0.0
  description: >-
    Authorization uses canonical roles from active memberships plus organization,
    program, and resource relationships. Custom claims and route entry never grant
    tenant resource access. Domain Firestore access is server-only.
servers: [{ url: /api/v1 }]
tags:
  [
    { name: Health },
    { name: Auth },
    { name: Participants },
    { name: Points },
    { name: Parent },
    { name: Child },
    { name: Onboarding },
  ]
paths:
  /onboarding/organization:
    post:
      tags: [Onboarding]
      operationId: onboardOrganization
      description: Creates the first organization and administrator membership for an eligible legacy super administrator.
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, slug, timezone]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                slug: { type: string, pattern: "^[a-z0-9-]{3,50}$" }
                timezone: { type: string, description: IANA timezone }
      responses:
        "201":
          {
            description: Organization onboarding completed,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [data],
                        properties:
                          {
                            data:
                              {
                                type: object,
                                required:
                                  [
                                    uid,
                                    organizationId,
                                    membershipId,
                                    outcome,
                                    claims,
                                  ],
                                properties:
                                  {
                                    uid: { type: string },
                                    organizationId: { type: string },
                                    membershipId: { type: string },
                                    outcome: { type: string, enum: [created] },
                                    claims:
                                      {
                                        type: string,
                                        enum: [refresh_required, synchronized],
                                      },
                                  },
                              },
                          },
                      },
                  },
              },
          }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /health:
    get:
      tags: [Health]
      operationId: apiHealth
      responses:
        {
          "200":
            {
              description: Healthy,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/Health" } },
                },
            },
        }
  /auth/session:
    get:
      tags: [Auth]
      operationId: getAuthSession
      description: Verifies a Firebase ID token and returns canonical roles from server-controlled users and memberships. Missing profiles are idempotently created without a role.
      security: [{ firebaseBearer: [] }]
      responses:
        "200":
          {
            description: Session state,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/AuthSessionResponse" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Auth]
      operationId: createAuthSession
      description: Deprecated compatibility alias for GET. Never accepts identity or role input.
      security: [{ firebaseBearer: [] }]
      responses:
        "200":
          {
            description: Session restored,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/AuthSessionResponse" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /auth/child-token:
    post:
      tags: [Auth]
      operationId: exchangeChildToken
      description: Exchanges family code, child handle and PIN for a short-lived Firebase custom token. Rate limited and generically fails.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ChildTokenRequest" } },
            },
        }
      responses:
        "200":
          {
            description: Login accepted,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/ChildTokenResponse" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /parent/dashboard:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      description: Real parent dashboard derived from linked participants and current program records.
      responses:
        "200": { description: Authorized parent dashboard }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /parent/notifications:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      description: Lists notifications addressed to the authenticated parent and scoped to an active membership organization.
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Tenant-scoped parent notifications }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /parent/children:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50 },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: status,
            in: query,
            schema: { enum: [active, pending, inactive] },
          }
        - { name: search, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        "200": { description: Relationship-scoped child summaries }
  /parent/children/{childId}:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        [{ name: childId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Relationship-scoped child summary }
        "404": { $ref: "#/components/responses/NotFound" }
  /parent/observations:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses: { "200": { description: Parent observations } }
    post:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, minLength: 8, maxLength: 128 },
          }
      description: Submits constructive positive recognition for moderation. This command does not award points.
      responses:
        { "201": { description: Observation persisted for moderation } }
  /parent/character:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: childId, in: query, required: true, schema: { type: string } }
        - {
            name: quarterId,
            in: query,
            required: true,
            schema: { type: string },
          }
      responses:
        {
          "200":
            {
              description: Versioned character selection or honest empty selection,
            },
        }
    patch:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      description: Updates a selection using expectedVersion optimistic concurrency. Cannot modify child submissions.
      responses:
        {
          "200": { description: Updated selection },
          "409": { description: Stale version },
        }
  /parent/family/activities:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: childId, in: query, required: true, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        {
          "200":
            { description: Configured activities and child completion state },
        }
  /parent/family/activities/{activityId}/completions:
    post:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - {
            name: activityId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, minLength: 8, maxLength: 128 },
          }
      description: Records a linked child's completion idempotently. Parents cannot provide a point amount.
      responses:
        "201": { description: Completion created }
        "200": { description: Exact retry returned existing completion }
  /parent/academic-support/configuration:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      description: Compatibility endpoint for active, organization-scoped academic-support categories.
      responses:
        "200": { description: Configured academic-support categories }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /parent/academic-support/requests:
    get:
      tags: [Parent]
      operationId: listAcademicSupportRequests
      security: [{ firebaseBearer: [] }]
      description: Lists only the authenticated parent's requests for children with an active, same-organization relationship. Empty collections return data as an empty array.
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - {
            name: cursor,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
        - {
            name: childId,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
        - {
            name: search,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 80 },
          }
        - {
            name: status,
            in: query,
            schema: { enum: [open, in_progress, resolved, closed] },
          }
      responses:
        "200":
          {
            description: Requester-,
            relationship-,
            and organization-scoped request page,
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Parent]
      operationId: createAcademicSupportRequest
      security: [{ firebaseBearer: [] }]
      responses:
        "201": { description: Academic-support request created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /parent/academic-support/requests/{requestId}:
    get:
      tags: [Parent]
      operationId: getAcademicSupportRequest
      security: [{ firebaseBearer: [] }]
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
      responses:
        "200": { description: Requester-scoped academic-support request }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /parent/support/categories:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses: { "200": { description: Configured support categories } }
  /parent/support/requests:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses: { "200": { description: Requester-scoped support requests } }
    post:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses: { "201": { description: Support request created } }
  /parent/reports:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: childId, in: query, required: true, schema: { type: string } }
      description: Returns approved progress only, explicit unavailable states, and a server calculation timestamp.
      responses:
        "200": { description: Relationship-scoped child report }
        "404": { $ref: "#/components/responses/NotFound" }
  /parent/reports/{childId}:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        [{ name: childId, in: path, required: true, schema: { type: string } }]
      responses:
        {
          "200":
            { description: Real child report with explicit unavailable states },
        }
  /parent/teams/{teamId}/progress:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: string } }
        - {
            name: quarterId,
            in: query,
            required: true,
            schema: { type: string },
          }
      responses:
        {
          "200":
            { description: Team progress calculated from append-only ledger },
        }
  /participants/{id}:
    get:
      tags: [Participants]
      operationId: getParticipant
      security: [{ firebaseBearer: [] }]
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Authorized participant summary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /points/sources/{source}/completions:
    post:
      tags: [Points]
      operationId: recordVerifiedSourceCompletion
      description: The implementation exposes only static, source-specific paths; arbitrary source values are not routed.
      security: [{ firebaseBearer: [] }]
      responses:
        "201":
          {
            description: Source completion and immutable ledger entry created atomically,
          }
        "200": { description: Exact idempotent retry }
        "409": { description: Conflicting idempotency-key reuse }

  /points/adjustments:
    post:
      tags: [Points]
      operationId: adjustPoints
      description: Creates an immutable administrator adjustment or reverses one eligible original award. Reversals are limited to one per original entry.
      security: [{ firebaseBearer: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 200, pattern: "^[A-Za-z0-9:_-]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    [
                      type,
                      participantId,
                      teamId,
                      quarterId,
                      points,
                      reason,
                      occurredAt,
                    ]
                  properties:
                    type: { const: adjustment }
                    participantId: { type: string, maxLength: 128 }
                    teamId: { type: string, maxLength: 128 }
                    quarterId: { type: string, maxLength: 128 }
                    points:
                      {
                        type: integer,
                        not: { const: 0 },
                        description: Signed point delta,
                      }
                    reason: { type: string, minLength: 3, maxLength: 500 }
                    occurredAt: { type: string, format: date-time }
                - type: object
                  additionalProperties: false
                  required: [type, originalEntryId, reason]
                  properties:
                    type: { const: reversal }
                    originalEntryId: { type: string, maxLength: 200 }
                    reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "201": { description: Adjustment and audit entries created atomically }
        "200": { description: Existing entry returned for duplicate key }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Duplicate reversal or idempotency conflict }
        "422": { $ref: "#/components/responses/Validation" }
  /child/today:
    get:
      tags: [Child]
      security: [{ firebaseBearer: [] }]
      description: Returns only the authenticated child's tenant-scoped data; collection views use honest null or empty availability states. Responses are private and not cacheable.
      responses:
        "200":
          {
            description: Authorized child response,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ChildSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Lifecycle or configuration conflict }
  /child/check-ins/today:
    get:
      tags: [Child]
      security: [{ firebaseBearer: [] }]
      description: Returns only the authenticated child's tenant-scoped data; collection views use honest null or empty availability states. Responses are private and not cacheable.
      responses:
        "200":
          {
            description: Authorized child response,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ChildSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Lifecycle or configuration conflict }
  /child/character:
    get:
      tags: [Child]
      security: [{ firebaseBearer: [] }]
      description: Returns only the authenticated child's tenant-scoped data; collection views use honest null or empty availability states. Responses are private and not cacheable.
      responses:
        "200":
          {
            description: Authorized child response,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ChildSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Lifecycle or configuration conflict }
  /child/reading:
    get:
      tags: [Child]
      security: [{ firebaseBearer: [] }]
      description: Returns only the authenticated child's tenant-scoped data; collection views use honest null or empty availability states. Responses are private and not cacheable.
      responses:
        "200":
          {
            description: Authorized child response,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ChildSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Lifecycle or configuration conflict }
  /child/reading/{assignmentId}:
    get:
      tags: [Child]
      security: [{ firebaseBearer: [] }]
      description: Returns only the authenticated child's tenant-scoped data; collection views use honest null or empty availability states. Responses are private and not cacheable.
      responses:
        "200":
          {
            description: Authorized child response,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ChildSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Lifecycle or configuration conflict }
  /child/projects:
    get:
      tags: [Child]
      security: [{ firebaseBearer: [] }]
      description: Returns only the authenticated child's tenant-scoped data; collection views use honest null or empty availability states. Responses are private and not cacheable.
      responses:
        "200":
          {
            description: Authorized child response,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ChildSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Lifecycle or configuration conflict }
    post:
      tags: [Child]
      security: [{ firebaseBearer: [] }]
      description: Creates a child-owned project in idea state; identity and tenancy are server resolved.
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { type: object } } },
        }
      responses:
        "200": { description: Saved }
        "201": { description: Created }
        "409": { description: Version or lifecycle conflict }
        "422": { $ref: "#/components/responses/Validation" }
  /child/projects/{projectId}:
    get:
      tags: [Child]
      security: [{ firebaseBearer: [] }]
      description: Returns only the authenticated child's tenant-scoped data; collection views use honest null or empty availability states. Responses are private and not cacheable.
      responses:
        "200":
          {
            description: Authorized child response,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ChildSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Lifecycle or configuration conflict }
    patch:
      tags: [Child]
      security: [{ firebaseBearer: [] }]
      description: Updates an owned project using required optimistic version and validated lifecycle transition.
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { type: object } } },
        }
      responses:
        "200": { description: Saved }
        "201": { description: Created }
        "409": { description: Version or lifecycle conflict }
        "422": { $ref: "#/components/responses/Validation" }
  /child/team:
    get:
      tags: [Child]
      security: [{ firebaseBearer: [] }]
      description: Returns only the authenticated child's tenant-scoped data; collection views use honest null or empty availability states. Responses are private and not cacheable.
      responses:
        "200":
          {
            description: Authorized child response,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ChildSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Lifecycle or configuration conflict }
  /child/check-ins/today/draft:
    put:
      tags: [Child]
      security: [{ firebaseBearer: [] }]
      description: Server resolves participant, organization, quarter, team and completion state. Final completion is idempotent and atomically snapshots an eligible participation-only point rule.
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { type: object } } },
        }
      responses:
        "200":
          {
            description: Saved or idempotently completed,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ChildSuccess" } },
              },
          }
        "201": { description: Created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Version or lifecycle conflict }
        "422": { $ref: "#/components/responses/Validation" }
  /child/check-ins/today/complete:
    post:
      tags: [Child]
      security: [{ firebaseBearer: [] }]
      description: Server resolves participant, organization, quarter, team and completion state. Final completion is idempotent and atomically snapshots an eligible participation-only point rule.
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { type: object } } },
        }
      responses:
        "200":
          {
            description: Saved or idempotently completed,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ChildSuccess" } },
              },
          }
        "201": { description: Created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Version or lifecycle conflict }
        "422": { $ref: "#/components/responses/Validation" }
  /child/character/draft:
    put:
      tags: [Child]
      security: [{ firebaseBearer: [] }]
      description: Server resolves participant, organization, quarter, team and completion state. Final completion is idempotent and atomically snapshots an eligible participation-only point rule.
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { type: object } } },
        }
      responses:
        "200":
          {
            description: Saved or idempotently completed,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ChildSuccess" } },
              },
          }
        "201": { description: Created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Version or lifecycle conflict }
        "422": { $ref: "#/components/responses/Validation" }
  /child/character/complete:
    post:
