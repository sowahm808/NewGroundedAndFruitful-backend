  /admin/bible-imports/{importId}/items/{itemId}:
    patch:
      tags: [Bible]
      operationId: correctBibleImportItem
      description: Corrects preview only; expectedVersion provides optimistic concurrency.
      security: [{ firebaseBearer: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/ImportId" },
          { name: itemId, in: path, required: true, schema: { type: string } },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/BibleItemPatch" } },
            },
        }
      responses:
        {
          "200": { description: Corrected preview },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /admin/bible-imports/{importId}/validate:
    post:
      tags: [Bible]
      operationId: validateBibleImport
      security: [{ firebaseBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ImportId" }]
      responses: { "200": { description: Validation errors and warnings } }
  /admin/bible-imports/{importId}/commit:
    post:
      tags: [Bible]
      operationId: commitBibleImport
      description: Idempotently commits validated preview as draft; never publishes.
      security: [{ firebaseBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ImportId" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/BibleLifecycle" } },
            },
        }
      responses:
        {
          "200": { description: Draft content set identifier },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /admin/bible-content:
    get:
      {
        tags: [Bible],
        operationId: listBibleContent,
        security: [{ firebaseBearer: [] }],
        responses: { "200": { description: Tenant-scoped content list } },
      }
  /admin/bible-content/{contentSetId}:
    get:
      {
        tags: [Bible],
        operationId: getBibleContent,
        security: [{ firebaseBearer: [] }],
        parameters: [{ $ref: "#/components/parameters/ContentSetId" }],
        responses:
          {
            "200":
              {
                description: Administrative content including protected answers,
              },
          },
      }
    patch:
      tags: [Bible]
      operationId: updateBibleContent
      security: [{ firebaseBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ContentSetId" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/BibleLifecycle" } },
            },
        }
      responses:
        {
          "200": { description: Updated draft },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /admin/bible-content/{contentSetId}/publish:
    post:
      {
        tags: [Bible],
        operationId: publishBibleContent,
        security: [{ firebaseBearer: [] }],
        parameters: [{ $ref: "#/components/parameters/ContentSetId" }],
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/BibleLifecycle" } },
              },
          },
        responses:
          {
            "200": { description: Published content },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /admin/bible-content/{contentSetId}/archive:
    post:
      {
        tags: [Bible],
        operationId: archiveBibleContent,
        security: [{ firebaseBearer: [] }],
        parameters: [{ $ref: "#/components/parameters/ContentSetId" }],
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/BibleLifecycle" } },
              },
          },
        responses: { "200": { description: Archived content } },
      }
  /child/bible:
    get:
      tags: [Bible]
      operationId: getChildBibleToday
      description: Resolves membership, participant, active quarter, timezone, and local date server-side. Child schema structurally excludes correct answers.
      security: [{ firebaseBearer: [] }]
      responses:
        {
          "200":
            {
              description: Assignment or honest no-assignment state,
              content:
                {
                  application/json:
                    {
                      schema:
                        { $ref: "#/components/schemas/ChildBibleResponse" },
                    },
                },
            },
        }
  /child/bible/history:
    get:
      {
        tags: [Bible],
        operationId: getChildBibleHistory,
        security: [{ firebaseBearer: [] }],
        responses:
          {
            "200":
              {
                description: Current child's completion summaries without scores or answers,
              },
          },
      }
  /child/bible/{activityId}/draft:
    put:
      tags: [Bible]
      operationId: saveChildBibleDraft
      description: Saves private answers without awarding points; expectedVersion is optional optimistic concurrency.
      security: [{ firebaseBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ActivityId" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/BibleAnswers" } },
            },
        }
      responses:
        {
          "200": { description: Draft status },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /child/bible/{activityId}/complete:
    post:
      tags: [Bible]
      operationId: completeChildBibleActivity
      description: Atomically finalizes private answers and awards configured participation points independent of correctness. Exact retries reuse the key.
      security: [{ firebaseBearer: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/ActivityId" },
          {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, maxLength: 128 },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/BibleAnswers" } },
            },
        }
      responses:
        {
          "200": { description: Child-safe completion without score },
          "409": { $ref: "#/components/responses/Conflict" },
          "503": { $ref: "#/components/responses/Internal" },
        }
components:
  parameters:
    ImportId:
      {
        name: importId,
        in: path,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 128 },
      }
    ContentSetId:
      {
        name: contentSetId,
        in: path,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 128 },
      }
    ActivityId:
      {
        name: activityId,
        in: path,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 128 },
      }
    QuarterId:
      {
        name: quarterId,
        in: path,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 128 },
      }
  requestBodies:
    QuarterLifecycle:
      required: true
      description: The expectedVersion must match the current record version.
      content:
        {
          application/json:
            {
              schema: { $ref: "#/components/schemas/QuarterLifecycle" },
              example: { expectedVersion: 1 },
            },
        }
  securitySchemes:
    {
      firebaseBearer:
        { type: http, scheme: bearer, bearerFormat: Firebase ID token },
    }
  responses:
    QuarterSuccess:
      {
        description: Transitioned quarter,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/QuarterResponse" } },
          },
      }
    QuarterNotFound:
      {
        description: QUARTER_NOT_FOUND (also used for an out-of-scope resource),
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    QuarterConflict:
      {
        description: QUARTER_INVALID_TRANSITION,
        QUARTER_VERSION_CONFLICT,
        or QUARTER_OVERLAP,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Unauthorized:
      {
        description: Authentication required,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Forbidden:
      {
        description: Resource access denied,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Conflict: { description: Version, lifecycle, or idempotency conflict }
    NotFound:
      {
        description: Not found,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Validation:
      {
        description: Validation failed,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    RateLimited:
      {
        description: Too many attempts,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Internal:
      {
        description: Unexpected server error,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
  schemas:
    BibleImportUpload:
      type: object
      required: [organizationId, quarterId, title, quizFile, answerKeyFile]
      properties:
        organizationId: { type: string }
        quarterId: { type: string }
        title: { type: string, maxLength: 200 }
        quizFile: { type: string, format: binary }
        answerKeyFile: { type: string, format: binary }
    BibleLifecycle:
      type: object
      required: [expectedVersion]
      properties:
        {
          expectedVersion: { type: integer, minimum: 1 },
          acknowledgeWarnings: { type: boolean },
          title: { type: string },
          description: { type: string },
        }
    BibleItemPatch:
      type: object
      required: [expectedVersion]
      properties:
        {
          expectedVersion: { type: integer, minimum: 1 },
          title: { type: string },
          scriptureReference: { type: string },
        }
    BibleAnswers:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        answers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [questionId, selectedChoiceId]
            properties:
              {
                questionId: { type: string },
                selectedChoiceId: { type: string, enum: [a, b, c, d, e] },
              }
    ChildBibleQuestion:
      type: object
      additionalProperties: false
      required: [id, position, prompt, choices]
      properties:
        id: { type: string }
        position: { type: integer }
        prompt: { type: string }
        choices:
          {
            type: array,
            items:
              {
                type: object,
                additionalProperties: false,
                required: [id, label, text],
                properties:
                  {
                    id: { type: string },
                    label: { type: string },
                    text: { type: string },
                  },
              },
          }
    ChildBibleResponse:
      description: Child-safe projection; answer keys, source metadata, private answers, and scores are structurally absent.
      type: object
      properties:
        data:
          type: object
          required:
            [available, responseStatus, quarterId, localDate, calculatedAt]
          properties:
            available: { type: boolean }
            reason:
              {
                type: [string, "null"],
                enum: [no_active_quarter, no_assignment, null],
              }
            responseStatus:
              { type: string, enum: [not_started, draft, completed] }
            quarterId: { type: [string, "null"] }
            localDate: { type: string, format: date }
            calculatedAt: { type: string, format: date-time }
            activity:
              {
                type: [object, "null"],
                properties:
                  {
                    id: { type: string },
                    title: { type: string },
                    scriptureReference: { type: string },
                    questions:
                      {
                        type: array,
                        items:
                          { $ref: "#/components/schemas/ChildBibleQuestion" },
                      },
                  },
              }
    QuarterStatus: { type: string, enum: [draft, active, closed, archived] }
    Quarter:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          description,
          startDate,
          endDate,
          status,
          organizationId,
          createdAt,
          updatedAt,
          createdBy,
          updatedBy,
          version,
        ]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 2000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/QuarterStatus" }
        organizationId:
          {
            type: string,
            description: Quarters are organization-scoped because programs and all quarter references are organization-owned.,
          }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedBy: { type: string }
        version: { type: integer, minimum: 1 }
    QuarterCreate:
      type: object
      additionalProperties: false
      required: [name]
      oneOf:
        - required: [startDate, endDate]
        - required: [startsOn, endsOn]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 2000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        startsOn:
          {
            type: string,
            format: date,
            deprecated: true,
            description: Compatibility alias for startDate. Do not send both naming styles.,
          }
        endsOn:
          {
            type: string,
            format: date,
            deprecated: true,
            description: Compatibility alias for endDate. Do not send both naming styles.,
          }
        organizationId:
          {
            type: string,
            description: Optional when the target is unambiguous (the administrator's sole organization or the sole deployment organization for a global super administrator); otherwise required.,
          }
    QuarterUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 2000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        expectedVersion: { type: integer, minimum: 1 }
    QuarterLifecycle:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties: { expectedVersion: { type: integer, minimum: 1 } }
    QuarterResponse:
      type: object
      required: [data]
      properties: { data: { $ref: "#/components/schemas/Quarter" } }
    QuarterListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              { type: array, items: { $ref: "#/components/schemas/Quarter" } }
            pagination:
              type: object
              required: [page, pageSize, total, totalPages]
              properties:
                {
                  page: { type: integer },
                  pageSize: { type: integer },
                  total: { type: integer },
                  totalPages: { type: integer },
                }
    ChildSuccess:
      type: object
      required: [data]
      properties:
        data:
          {
            description: Route-specific child resource or honest availability state,
          }
    Health:
      {
        type: object,
        required: [status, environment],
        properties:
          {
            status: { type: string, const: ok },
            environment: { type: string },
          },
      }
    Error:
      {
        type: object,
        required: [error],
        properties:
          {
            error:
              {
                type: object,
                required: [code, message, requestId],
                properties:
                  {
                    code: { type: string },
                    message: { type: string },
                    requestId: { type: string },
                    fieldErrors: { type: object, additionalProperties: true },
                  },
              },
          },
      }
    AuthSessionResponse:
      {
        type: object,
        required: [data],
        properties:
          {
            data:
              {
                type: object,
                required:
                  [
                    uid,
                    email,
                    displayName,
                    roles,
                    disabled,
                    onboardingStatus,
                    memberships,
                    authorization,
                  ],
                properties:
                  {
                    uid: { type: string },
                    email: { type: [string, "null"] },
                    displayName: { type: string },
                    roles:
                      {
                        type: array,
                        items:
                          {
                            type: string,
                            enum:
                              [
                                child,
                                parent,
                                mentor,
                                observer,
                                admin,
                                super_admin,
                              ],
                          },
                      },
                    disabled: { type: boolean },
                    onboardingStatus:
                      {
                        type: string,
                        enum:
                          [
                            complete,
                            organization_required,
                            role_required,
                            pending,
                            disabled,
                            session_error,
                          ],
                      },
                    memberships:
                      {
                        type: array,
                        items:
                          {
                            type: object,
                            required: [organizationId, roles, status],
                            properties:
                              {
                                organizationId: { type: string },
                                roles:
                                  {
                                    type: array,
                                    items:
                                      {
                                        type: string,
                                        enum:
                                          [
                                            child,
                                            parent,
                                            mentor,
                                            observer,
                                            admin,
                                            super_admin,
                                          ],
                                      },
                                  },
                                status:
                                  {
                                    type: string,
                                    enum: [active, pending, suspended, revoked],
                                  },
                              },
                          },
                      },
                    authorization:
                      {
                        type: object,
                        required: [source, migrationRequired],
                        properties:
                          {
                            source:
                              {
                                type: string,
                                enum: [membership, legacy_user_profile, none],
                              },
                            migrationRequired: { type: boolean },
                          },
                      },
                  },
              },
          },
      }
    ChildTokenRequest:
      {
        type: object,
        additionalProperties: false,
        required: [familyCode, handle, pin],
        properties:
          {
            familyCode:
              {
                type: string,
                minLength: 8,
                maxLength: 24,
                pattern: "^[a-z0-9_-]+$",
                description: NFKC-normalized,
                trimmed,
                and lowercased server-side,
              },
            handle:
              {
                type: string,
                minLength: 2,
                maxLength: 24,
                pattern: "^[a-z0-9][a-z0-9._-]*$",
                description: NFKC-normalized,
                trimmed,
                and lowercased server-side,
              },
            pin:
              { type: string, format: password, minLength: 4, maxLength: 128 },
          },
      }
    ChildTokenResponse:
      {
        type: object,
        required: [data],
        properties:
          {
            data:
              {
                type: object,
                required: [customToken],
                properties: { customToken: { type: string } },
              },
          },
      }
    Completion:
      {
        type: object,
        additionalProperties: false,
        required:
          [
            participantId,
            teamId,
            quarterId,
            sourceType,
            sourceId,
            reason,
            occurredAt,
          ],
        properties:
          {
            participantId: { type: string },
            teamId: { type: string },
            quarterId: { type: string },
            sourceType:
              {
                type: string,
                enum:
                  [
                    daily_checkin,
                    gratitude,
                    character_assessment,
                    bible_activity,
                    family_activity,
                    reading,
                    project_milestone,
                    academic_session,
                    character_observation_bonus,
                  ],
              },
            sourceId: { type: string },
            reason: { type: string },
            occurredAt: { type: string, format: date-time },
          },
      }
