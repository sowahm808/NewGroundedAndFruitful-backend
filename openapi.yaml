openapi: 3.1.0
info:
  title: Grounded & Fruitful API
  version: 1.0.0
  description: >-
    Authorization uses canonical roles from active memberships plus organization,
    program, and resource relationships. Custom claims and route entry never grant
    tenant resource access. Domain Firestore access is server-only.
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Auth
  - name: Onboarding
  - name: Participants
  - name: Points
  - name: Parent
  - name: Child
  - name: Administration
  - name: Bible
  - name: Reports

paths:
  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear the current client bearer session without global revocation
      responses:
        "204":
          description: Client may discard its local Firebase session

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke the authenticated user's Firebase refresh tokens
      security: [{ firebaseBearer: [] }]
      responses:
        "204":
          description: All refresh tokens revoked
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/registration-intent:
    post:
      tags: [Auth]
      operationId: registerAccountIntentCompatibility
      summary: Idempotently begin personal or organization registration
      description: >-
        Records the authenticated Firebase user's own intent without requiring a
        role or membership. It never creates a workspace, membership, or role.
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [intent]
                  properties:
                    intent: { const: personal }
                    timezone: { type: string, default: UTC }
                - type: object
                  additionalProperties: false
                  required: [intent]
                  properties:
                    intent: { const: organization }
      responses:
        "201":
          description: Registration intent selected (including an exact retry)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      [registrationIntent, onboardingStatus, nextStep, version]
                    properties:
                      registrationIntent: { enum: [personal, organization] }
                      onboardingStatus:
                        enum:
                          [
                            personal_workspace_required,
                            organization_setup_required,
                          ]
                      nextStep:
                        enum: [personal_workspace_setup, organization_setup]
                      version: { type: integer, minimum: 1 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Intent conflicts with bootstrapped state
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/registration:
    post:
      tags: [Auth]
      operationId: registerAccountIntent
      summary: Idempotently begin personal or organization registration
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [intent]
                  properties:
                    intent: { const: personal }
                    timezone: { type: string, default: UTC }
                - type: object
                  additionalProperties: false
                  required: [intent]
                  properties:
                    intent: { const: organization }
      responses:
        "201":
          description: Registration intent accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"

  /auth/session/workspace:
    put:
      tags: [Auth]
      operationId: selectActiveWorkspace
      description: Selects an active context only after server-side active membership validation; selection never grants access.
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workspaceId]
              properties:
                workspaceId: { type: string }
      responses:
        "200":
          description: Workspace selected
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No active membership in workspace
          $ref: "#/components/responses/Forbidden"

  /auth/elevations:
    post:
      tags: [Auth]
      operationId: grantTemporaryElevation
      description: Requires an explicitly authorized platform grantor and authentication within five minutes. Self-elevation is forbidden.
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId, scope, reason, startsAt, expiresAt]
              properties:
                userId: { type: string }
                roles: { type: array, items: { type: string }, maxItems: 10 }
                capabilities:
                  type: array
                  items:
                    type: string
                    enum:
                      [
                        organizations.manage,
                        memberships.manage,
                        quarters.manage,
                        bible.publish,
                        roles.elevate,
                        platform.audit.read,
                      ]
                scope:
                  oneOf:
                    - type: object
                      required: [type]
                      properties: { type: { const: platform } }
                    - type: object
                      required: [type, workspaceId]
                      properties:
                        type: { const: workspace }
                        workspaceId: { type: string }
                reason: { type: string, minLength: 8, maxLength: 500 }
                startsAt: { type: string, format: date-time }
                expiresAt: { type: string, format: date-time }
                maxUses: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "201":
          description: Elevation granted and audited
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /auth/elevations/{grantId}/revoke:
    post:
      tags: [Auth]
      operationId: revokeTemporaryElevation
      security: [{ firebaseBearer: [] }]
      parameters:
        - in: path
          name: grantId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Elevation immediately revoked and audited
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/onboarding/personal-workspace:
    post:
      tags: [Onboarding]
      operationId: onboardPersonalWorkspace
      description: Atomically creates the single personal tenant, owner governance membership, and parent persona for an authenticated personal registrant. It grants no organization-admin or platform authority.
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [timezone]
              properties:
                timezone: { type: string, description: Valid IANA timezone }
      responses:
        "201":
          description: Personal workspace onboarding completed (including an exact retry)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      [
                        workspace,
                        membership,
                        activeWorkspaceId,
                        onboardingStatus,
                        nextStep,
                        tokenRefreshRequired,
                      ]
                    properties:
                      workspace: { type: object }
                      membership: { type: object }
                      activeWorkspaceId: { type: string }
                      onboardingStatus: { const: complete }
                      nextStep: { const: dashboard }
                      tokenRefreshRequired: { const: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /onboarding/personal:
    post:
      tags: [Onboarding]
      operationId: onboardPersonalWorkspaceCompatibility
      summary: Frontend-compatible personal workspace onboarding
      description: >-
        Compatibility alias for POST /auth/onboarding/personal-workspace. It
        atomically creates the authenticated personal registrant's tenant and
        owner-only membership.
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [timezone]
              properties:
                timezone: { type: string, description: Valid IANA timezone }
      responses:
        "201": { description: Personal workspace onboarding completed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /auth/onboarding/organization:
    post:
      tags: [Onboarding]
      operationId: onboardOrganization
      description: Creates the first organization and owner/admin membership for an authenticated organization registrant. No existing role, workspace, or membership is required.
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, slug, timezone]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                slug: { type: string, pattern: "^[a-z0-9-]{3,50}$" }
                timezone: { type: string, description: IANA timezone }
      responses:
        "201":
          description: Organization onboarding completed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      [
                        workspace,
                        membership,
                        onboardingStatus,
                        nextStep,
                        activeWorkspaceId,
                        tokenRefreshRequired,
                      ]
                    properties:
                      workspace:
                        type: object
                        required: [id, type, name, slug, timezone, status]
                        properties:
                          id: { type: string }
                          type: { const: organization }
                          name: { type: string }
                          slug: { type: string }
                          timezone: { type: string }
                          status: { const: active }
                      membership:
                        type: object
                        description: organizationId is a compatibility tenant alias and always equals workspaceId.
                        required:
                          [id, workspaceId, organizationId, roles, status]
                        properties:
                          id: { type: string }
                          workspaceId: { type: string }
                          organizationId: { type: string }
                          roles:
                            type: array
                            items:
                              type: string
                              enum: [owner, admin]
                          status: { const: active }
                      onboardingStatus: { const: complete }
                      nextStep: { const: dashboard }
                      activeWorkspaceId: { type: string }
                      tokenRefreshRequired: { const: true }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /health:
    get:
      tags: [Health]
      operationId: apiHealth
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /auth/session:
    get:
      tags: [Auth]
      operationId: getAuthSession
      description: Verifies a Firebase ID token and returns canonical roles from server-controlled users and memberships. Missing profiles are idempotently created without a role.
      security: [{ firebaseBearer: [] }]
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Auth]
      operationId: createAuthSession
      description: Deprecated compatibility alias for GET. Never accepts identity or role input.
      security: [{ firebaseBearer: [] }]
      responses:
        "200":
          description: Session restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /auth/child-token:
    post:
      tags: [Auth]
      operationId: exchangeChildToken
      description: Exchanges family code, child handle and PIN for a short-lived Firebase custom token. Rate limited and generically fails.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChildTokenRequest" }
      responses:
        "200":
          description: Login accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChildTokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/child-login:
    post:
      tags: [Auth]
      operationId: loginChildParticipant
      description: Resolves a family or organization code and exchanges a participant handle and PIN for a child-persona token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [familyCode, handle, pin]
              properties:
                familyCode: { type: string, minLength: 1, maxLength: 128 }
                handle: { type: string, minLength: 1, maxLength: 80 }
                pin: { type: string, pattern: "^[0-9]{4,6}$" }
      responses:
        "200": { description: Child session token and participant summary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /parent/dashboard:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      description: Real parent dashboard derived from linked participants and current program records.
      responses:
        "200": { description: Authorized parent dashboard }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /parent/notifications:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      description: Lists notifications addressed to the authenticated parent and scoped to an active membership organization.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200": { description: Tenant-scoped parent notifications }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /parent/children:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { enum: [active, pending, inactive] }
        - name: search
          in: query
          schema: { type: string, maxLength: 80 }
      responses:
        "200": { description: Relationship-scoped child summaries }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /parent/children/{childId}:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Relationship-scoped child summary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /parent/participation:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      description: Lists participation completions for a child linked to the authenticated parent.
      parameters:
        - name: childId
          in: query
          required: true
          schema: { type: string }
        - name: quarterId
          in: query
          schema: { type: string }
      responses:
        "200": { description: Relationship-scoped participation completions }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /parent/observations:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses:
        "200": { description: Parent observations }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      description: Submits constructive positive recognition for moderation. This command does not award points.
      responses:
        "201": { description: Observation persisted for moderation }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /parent/character:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - name: childId
          in: query
          required: true
          schema: { type: string }
        - name: quarterId
          in: query
          description: Defaults to the organization's active quarter when omitted.
          schema: { type: string }
      responses:
        "200":
          description: Versioned character selection or honest empty selection
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      description: Updates a selection using expectedVersion optimistic concurrency. Cannot modify child submissions.
      responses:
        "200": { description: Updated selection }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          {
            description: Stale version,
            $ref: "#/components/responses/Conflict",
          }
        "422": { $ref: "#/components/responses/Validation" }

  /parent/character/qualities:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses:
        "200": { description: Active character qualities or standard defaults }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /parent/character/selection:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - name: childId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: Active-quarter character selection }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      description: Saves exactly three qualities with optional optimistic locking.
      responses:
        "200": { description: Updated character selection }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /parent/children/{childId}/credentials:
    post:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string }
      description: Sets a sanitized child handle and a salted SHA-256 hash of a 4-to-6 digit PIN.
      responses:
        "200":
          description: Child credentials updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [success, participantId, handle, updatedAt]
                    properties:
                      success: { type: boolean, const: true }
                      participantId: { type: string }
                      handle: { type: string }
                      updatedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /parent/family/activities:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - name: childId
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Configured activities and child completion state
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /parent/family/activities/{activityId}/completions:
    post:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - name: activityId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      description: Records a linked child's completion idempotently. Parents cannot provide a point amount.
      responses:
        "200": { description: Exact retry returned existing completion }
        "201": { description: Completion created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /parent/academic-support/configuration:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      description: Compatibility endpoint for active, organization-scoped academic-support categories.
      responses:
        "200": { description: Configured academic-support categories }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /parent/academic-support/requests:
    get:
      tags: [Parent]
      operationId: listAcademicSupportRequests
      security: [{ firebaseBearer: [] }]
      description: Lists only the authenticated parent's requests for children with an active, same-organization relationship. Empty collections return data as an empty array.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: childId
          in: query
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: search
          in: query
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: status
          in: query
          schema: { enum: [open, in_progress, resolved, closed] }
      responses:
        "200":
          description: Requester-, relationship-, and organization-scoped request page
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Parent]
      operationId: createAcademicSupportRequest
      security: [{ firebaseBearer: [] }]
      responses:
        "201": { description: Academic-support request created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /parent/academic-support/requests/{requestId}:
    get:
      tags: [Parent]
      operationId: getAcademicSupportRequest
      security: [{ firebaseBearer: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200": { description: Requester-scoped academic-support request }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /parent/support/categories:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses: { "200": { description: Configured support categories } }

  /parent/support/requests:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses: { "200": { description: Requester-scoped support requests } }
    post:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses: { "201": { description: Support request created } }

  /parent/reports:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - name: childId
          in: query
          required: true
          schema: { type: string }
      description: Returns approved progress only, explicit unavailable states, and a server calculation timestamp.
      responses:
        "200": { description: Relationship-scoped child report }
        "401": { $ref: "#/components/responses/Unauthorized" }
