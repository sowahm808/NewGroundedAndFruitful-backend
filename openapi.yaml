openapi: 3.1.0
info:
  title: Grounded & Fruitful API
  version: 1.0.0
  description: Render-hosted API. Authoritative writes require a verified Firebase ID token.
servers: [{ url: /api/v1 }]
tags:
  [{ name: Health }, { name: Auth }, { name: Participants }, { name: Points }]
paths:
  /health:
    get:
      tags: [Health]
      operationId: apiHealth
      responses:
        {
          "200":
            {
              description: Healthy,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/Health" } },
                },
            },
        }
  /auth/session:
    post:
      tags: [Auth]
      operationId: createAuthSession
      description: Verifies a Firebase ID token, provisions users/{uid} when missing, and returns the normalized session user.
      security: [{ firebaseBearer: [] }]
      responses:
        "200":
          {
            description: Session restored,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/AuthSessionResponse" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /auth/child-login:
    post:
      tags: [Auth]
      operationId: childLogin
      description: Exchanges family code, child handle and password for a short-lived Firebase custom token. Rate limited and generically fails.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ChildLogin" } },
            },
        }
      responses:
        "200":
          {
            description: Login accepted,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/ChildLoginResponse" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /participants/{id}:
    get:
      tags: [Participants]
      operationId: getParticipant
      security: [{ firebaseBearer: [] }]
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Authorized participant summary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /points/completions:
    post:
      tags: [Points]
      operationId: recordCompletion
      security: [{ firebaseBearer: [] }]
      parameters:
        [
          {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, maxLength: 200 },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Completion" } },
            },
        }
      responses:
        "201": { description: Immutable ledger entry created }
        "200": { description: Existing entry returned for duplicate key }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
components:
  securitySchemes:
    {
      firebaseBearer:
        { type: http, scheme: bearer, bearerFormat: Firebase ID token },
    }
  responses:
    Unauthorized:
      {
        description: Authentication required,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Forbidden:
      {
        description: Resource access denied,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    NotFound:
      {
        description: Not found,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Validation:
      {
        description: Validation failed,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    RateLimited:
      {
        description: Too many attempts,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Internal:
      {
        description: Unexpected server error,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
  schemas:
    Health:
      {
        type: object,
        required: [status, environment],
        properties:
          {
            status: { type: string, const: ok },
            environment: { type: string },
          },
      }
    Error:
      {
        type: object,
        required: [error],
        properties:
          {
            error:
              {
                type: object,
                required: [code, message, requestId],
                properties:
                  {
                    code: { type: string },
                    message: { type: string },
                    requestId: { type: string },
                  },
              },
          },
      }
    AuthSessionResponse:
      {
        type: object,
        required: [data],
        properties:
          {
            data:
              {
                type: object,
                required: [uid, email, displayName, roles, disabled],
                properties:
                  {
                    uid: { type: string },
                    email: { type: [string, "null"] },
                    displayName: { type: string },
                    roles:
                      {
                        type: array,
                        items:
                          {
                            type: string,
                            enum:
                              [
                                child,
                                parent,
                                mentor,
                                observer,
                                admin,
                                super_admin,
                              ],
                          },
                      },
                    disabled: { type: boolean },
                  },
              },
          },
      }
    ChildLogin:
      {
        type: object,
        additionalProperties: false,
        required: [familyCode, handle, password],
        properties:
          {
            familyCode: { type: string },
            handle: { type: string },
            password: { type: string, format: password },
          },
      }
    ChildLoginResponse:
      {
        type: object,
        required: [data],
        properties:
          {
            data:
              {
                type: object,
                required: [customToken, tokenType],
                properties:
                  {
                    customToken: { type: string },
                    tokenType: { type: string, const: firebaseCustomToken },
                  },
              },
          },
      }
    Completion:
      {
        type: object,
        additionalProperties: false,
        required:
          [
            participantId,
            teamId,
            quarterId,
            sourceType,
            sourceId,
            reason,
            occurredAt,
          ],
        properties:
          {
            participantId: { type: string },
            teamId: { type: string },
            quarterId: { type: string },
            sourceType: { type: string },
            sourceId: { type: string },
            reason: { type: string },
            occurredAt: { type: string, format: date-time },
          },
      }
