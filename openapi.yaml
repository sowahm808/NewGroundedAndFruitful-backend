components:
  parameters:
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
    ReportOrganizationId:
      name: organizationId
      in: query
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ContentSetId:
      name: contentSetId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ActivityId:
      name: activityId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    QuarterId:
      name: quarterId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }

  requestBodies:
    QuarterLifecycle:
      required: true
      description: The expectedVersion must match the current record version.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/QuarterLifecycle" }
          example: { expectedVersion: 1 }

  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token

  responses:
    QuarterSuccess:
      description: Transitioned quarter
      content:
        application/json:
          schema: { $ref: "#/components/schemas/QuarterResponse" }
    QuarterNotFound:
      description: QUARTER_NOT_FOUND (also used for an out-of-scope resource)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    QuarterConflict:
      description: QUARTER_INVALID_TRANSITION, QUARTER_VERSION_CONFLICT, or QUARTER_OVERLAP
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Resource access denied
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Version, lifecycle, or idempotency conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Validation:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    ReportAction:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId: { type: string, pattern: "^[A-Za-z0-9_-]+$" }

    ReportJobCreate:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          participantId,
          reportType,
          policyVersion,
          idempotencyKey,
        ]
      properties:
        organizationId: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
        participantId: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
        reportType: { type: string, pattern: "^[a-z0-9._-]{1,80}$" }
        policyVersion: { type: string, minLength: 1, maxLength: 40 }
        idempotencyKey: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }

    ParentDataResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: object, additionalProperties: true }

    ParentCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { type: object, additionalProperties: true }
        meta:
          type: object
          additionalProperties: false
          required: [nextCursor]
          properties:
            nextCursor: { type: [string, "null"] }

    CalculatedSource:
      type: object
      required: [calculatedAt, sourceQuarterId, sourceWeekId]
      properties:
        calculatedAt: { type: string, format: date-time }
        sourceQuarterId: { type: [string, "null"] }
        sourceWeekId: { type: [string, "null"] }

    BibleImportUpload:
      type: object
      additionalProperties: false
      required: [organizationId, quarterId, title, quizFile, answerKeyFile]
      properties:
        organizationId: { type: string, minLength: 1, maxLength: 128 }
        quarterId: { type: string, minLength: 1, maxLength: 128 }
        title: { type: string, minLength: 1, maxLength: 200 }
        quizFile:
          type: string
          format: binary
          description: DOCX quiz document; maximum 5 MiB
        answerKeyFile:
          type: string
          format: binary
          description: DOCX answer-key document; maximum 5 MiB

    BibleLifecycle:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        acknowledgeWarnings: { type: boolean }
        title: { type: string }
        description: { type: string }

    BibleItemPatch:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        title: { type: string }
        scriptureReference: { type: string }

    BibleAnswers:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        answers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [questionId, selectedChoiceId]
            properties:
              questionId: { type: string }
              selectedChoiceId: { type: string, enum: [a, b, c, d, e] }

    ChildBibleQuestion:
      type: object
      additionalProperties: false
      required: [id, position, prompt, choices]
      properties:
        id: { type: string }
        position: { type: integer }
        prompt: { type: string }
        choices:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, label, text]
            properties:
              id: { type: string }
              label: { type: string }
              text: { type: string }

    ChildBibleResponse:
      type: object
      properties:
        data:
          type: object
          required:
            [available, responseStatus, quarterId, localDate, calculatedAt]
          properties:
            available: { type: boolean }
            reason:
              type: [string, "null"]
              enum: [no_active_quarter, no_assignment, null]
            responseStatus:
              type: string
              enum: [not_started, draft, completed]
            quarterId: { type: [string, "null"] }
            localDate: { type: string, format: date }
            calculatedAt: { type: string, format: date-time }
            activity:
              type: [object, "null"]
              properties:
                id: { type: string }
                title: { type: string }
                scriptureReference: { type: string }
                questions:
                  type: array
                  items: { $ref: "#/components/schemas/ChildBibleQuestion" }

    AdminParticipant:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          enrollmentStatus,
          linkedGuardian,
          team,
          currentQuarterStatus,
          updatedAt,
          allowedActions,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        enrollmentStatus:
          type: string
          enum: [pending, active, withdrawn]
        linkedGuardian: { type: [string, "null"] }
        team: { type: [string, "null"] }
        currentQuarterStatus: { type: string }
        updatedAt: { type: string, format: date-time }
        allowedActions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [edit, assign]

    ParticipantListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AdminParticipant" }
            pagination:
              type: object
              required: [page, pageSize, total, totalPages]
              properties:
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 0 }

    QuarterStatus:
      type: string
      enum: [draft, open, closed, archived]

    QuarterAllowedAction:
      type: string
      enum: [view, edit, activate, close, archive]

    QuarterWorkspace:
      type: object
      additionalProperties: false
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, const: organization }

    Quarter:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          description,
          startDate,
          endDate,
          status,
          organizationId,
          workspace,
          allowedActions,
          createdAt,
          updatedAt,
          createdBy,
          updatedBy,
          version,
        ]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 2000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/QuarterStatus" }
        organizationId: { type: string, deprecated: true }
        workspace: { $ref: "#/components/schemas/QuarterWorkspace" }
        allowedActions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/QuarterAllowedAction" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedBy: { type: string }
        version: { type: integer, minimum: 1 }

    QuarterCreate:
      type: object
      additionalProperties: false
      required: [name]
      oneOf:
        - required: [startDate, endDate]
        - required: [startsOn, endsOn]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 2000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        startsOn: { type: string, format: date, deprecated: true }
        endsOn: { type: string, format: date, deprecated: true }
        organizationId: { type: string }

    QuarterUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 2000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        expectedVersion: { type: integer, minimum: 1 }

    QuarterLifecycle:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties: { expectedVersion: { type: integer, minimum: 1 } }

    QuarterResponse:
      type: object
      required: [data]
      properties: { data: { $ref: "#/components/schemas/Quarter" } }

    QuarterListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Quarter" }
            pagination:
              type: object
              required: [page, pageSize, total, totalPages]
              properties:
                page: { type: integer }
                pageSize: { type: integer }
                total: { type: integer }
                totalPages: { type: integer }

    ChildSuccess:
      type: object
      required: [data]
      properties:
        data:
          type: object
          description: Route-specific child resource or honest availability state

    Health:
      type: object
      required: [status, environment]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        environment: { type: string }
        dependencies:
          type: object
          properties:
            bibleImportStorage:
              type: object
              properties:
                status:
                  type: string
                  enum: [checking, ready, unavailable]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            fieldErrors: { type: object, additionalProperties: true }

    AuthSessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required:
            [
              uid,
              email,
              displayName,
              roles,
              platformRoles,
              disabled,
              onboardingStatus,
              nextStep,
              memberships,
              authorization,
              claimSynchronization,
              tokenRefreshRequired,
            ]
          properties:
            uid: { type: string }
            email: { type: [string, "null"] }
            displayName: { type: string }
            roles:
              type: array
              items:
                type: string
                enum: [child, parent, mentor, observer, admin, super_admin]
            platformRoles:
              type: array
              items: { type: string, enum: [super_admin] }
            activeOrganizationId: { type: string }
            tokenRefreshRequired: { type: boolean }
            claimSynchronization:
              type: object
              required: [status, tokenRefreshRequired]
              properties:
                status:
                  type: string
                  enum: [synchronized, refresh_required, retry_required]
                tokenRefreshRequired: { type: boolean }
            disabled: { type: boolean }
            onboardingStatus:
              type: string
              enum:
                [
                  complete,
                  registration_intent_required,
                  personal_workspace_required,
                  organization_setup_required,
                  invitation_required,
                  account_recovery_required,
                  organization_required,
                  role_required,
                  pending,
                  disabled,
                  session_error,
                ]
            registrationIntent:
              type: string
              enum: [personal, organization]
            nextStep:
              type: string
              enum:
                [
                  choose_account_type,
                  personal_workspace_setup,
                  organization_setup,
                  accept_invitation,
                  await_role_assignment,
                  account_recovery,
                  dashboard,
                ]
            accountStateReason:
              type: string
              enum:
                [
                  registration_intent_missing,
                  organization_role_not_assigned,
                  legacy_account_unclassified,
                  account_disabled,
                ]
            pendingInvitation: { type: boolean }
            recoveryReference:
              type: string
              pattern: "^AR-[A-F0-9]{12}$"
            activeWorkspaceId: { type: string }
            activeWorkspace:
              type: object
              required: [id, type, name, status]
              properties:
                id: { type: string }
                type: { type: string, enum: [personal, organization] }
                name: { type: string }
                status: { type: string }
            workspaceRoles:
              type: array
              items: { type: string }
            personas:
              type: array
              items:
                type: string
                enum: [child, parent, mentor, observer]
            capabilities:
              type: array
              items: { type: string }
            effectiveRoles:
              type: array
              items: { type: string }
            workspaces:
              type: array
              items:
                type: object
                required: [id, type, name, roles, status]
                properties:
                  id: { type: string }
                  type: { type: string, enum: [personal, organization] }
                  name: { type: string }
                  roles: { type: array, items: { type: string } }
                  status: { type: string }
            memberships:
              type: array
              items:
                type: object
                required: [organizationId, roles, status]
                properties:
                  workspaceId: { type: string }
                  organizationId: { type: string }
                  workspaceRoles: { type: array, items: { type: string } }
                  personas:
                    type: array
                    items:
                      type: string
                      enum: [child, parent, mentor, observer]
                  roles:
                    type: array
                    items:
                      type: string
                      enum:
                        [child, parent, mentor, observer, admin, super_admin]
                  status:
                    type: string
                    enum:
                      [active, pending, suspended, revoked, expired, invalid]
            authorization:
              type: object
              required: [source, migrationRequired]
              properties:
                source:
                  type: string
                  enum:
                    [
                      platform_claims_and_memberships,
                      membership,
                      legacy_user_profile,
                      none,
                    ]
                migrationRequired: { type: boolean }

    ChildTokenRequest:
      type: object
      additionalProperties: false
      required: [familyCode, handle, pin]
      properties:
        familyCode:
          type: string
          minLength: 8
          maxLength: 24
          pattern: "^[a-z0-9_-]+$"
        handle:
          type: string
          minLength: 2
          maxLength: 24
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        pin:
          type: string
          format: password
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"

    ChildTokenResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [customToken]
          properties:
            customToken: { type: string }

    Completion:
      type: object
      additionalProperties: false
      required:
        [
          participantId,
          teamId,
          quarterId,
          sourceType,
          sourceId,
          reason,
          occurredAt,
        ]
      properties:
        participantId: { type: string }
        teamId: { type: string }
        quarterId: { type: string }
        sourceType:
          type: string
          enum:
            [
              daily_checkin,
              gratitude,
              character_assessment,
              bible_activity,
              family_activity,
              reading,
              project_milestone,
              academic_session,
              character_observation_bonus,
            ]
        sourceId: { type: string }
        reason: { type: string }
        occurredAt: { type: string, format: date-time }
