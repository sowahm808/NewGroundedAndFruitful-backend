openapi: 3.1.0
info: {title: Grounded & Fruitful API, version: 1.0.0}
servers: [{url: /api/v1}]
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': {description: Healthy}
components:
  securitySchemes:
    firebaseBearer: {type: http, scheme: bearer, bearerFormat: Firebase ID token}
  schemas:
    Error: {type: object, required: [error], properties: {error: {type: object, required: [code, message], properties: {code: {type: string}, message: {type: string}}}}}
