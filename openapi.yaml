openapi: 3.1.0
info:
  title: Grounded & Fruitful API
  version: 1.0.0
  description: Render-hosted API. Authoritative writes require a verified Firebase ID token.
servers: [{ url: /api/v1 }]
tags:
  [
    { name: Health },
    { name: Auth },
    { name: Participants },
    { name: Points },
    { name: Parent },
  ]
paths:
  /health:
    get:
      tags: [Health]
      operationId: apiHealth
      responses:
        {
          "200":
            {
              description: Healthy,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/Health" } },
                },
            },
        }
  /auth/session:
    get:
      tags: [Auth]
      operationId: getAuthSession
      description: Verifies a Firebase ID token and returns canonical roles from server-controlled users and memberships. Missing profiles are idempotently created without a role.
      security: [{ firebaseBearer: [] }]
      responses:
        "200":
          {
            description: Session state,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/AuthSessionResponse" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Auth]
      operationId: createAuthSession
      description: Deprecated compatibility alias for GET. Never accepts identity or role input.
      security: [{ firebaseBearer: [] }]
      responses:
        "200":
          {
            description: Session restored,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/AuthSessionResponse" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /auth/child-token:
    post:
      tags: [Auth]
      operationId: exchangeChildToken
      description: Exchanges family code, child handle and PIN for a short-lived Firebase custom token. Rate limited and generically fails.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ChildTokenRequest" } },
            },
        }
      responses:
        "200":
          {
            description: Login accepted,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/ChildTokenResponse" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /parent/dashboard:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      description: Real parent dashboard derived from linked participants and current program records.
      responses:
        "200": { description: Authorized parent dashboard }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /parent/children:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50 },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: status,
            in: query,
            schema: { enum: [active, pending, inactive] },
          }
        - { name: search, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        "200": { description: Relationship-scoped child summaries }
  /parent/children/{childId}:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        [{ name: childId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Relationship-scoped child summary }
        "404": { $ref: "#/components/responses/NotFound" }
  /parent/observations:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses: { "200": { description: Parent observations } }
    post:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses:
        { "201": { description: Observation persisted for moderation } }
  /parent/family-activities:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses:
        {
          "200":
            { description: Configured activities and child completion state },
        }
  /parent/family-activities/completions:
    post:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses:
        {
          "201": { description: Completion created },
          "200": { description: Existing idempotent completion },
        }
  /parent/support/categories:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses: { "200": { description: Configured support categories } }
  /parent/support/requests:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses: { "200": { description: Requester-scoped support requests } }
    post:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      responses: { "201": { description: Support request created } }
  /parent/reports/{childId}:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        [{ name: childId, in: path, required: true, schema: { type: string } }]
      responses:
        {
          "200":
            { description: Real child report with explicit unavailable states },
        }
  /parent/teams/{teamId}/progress:
    get:
      tags: [Parent]
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: string } }
        - {
            name: quarterId,
            in: query,
            required: true,
            schema: { type: string },
          }
      responses:
        {
          "200":
            { description: Team progress calculated from append-only ledger },
        }
  /participants/{id}:
    get:
      tags: [Participants]
      operationId: getParticipant
      security: [{ firebaseBearer: [] }]
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Authorized participant summary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /points/completions:
    post:
      tags: [Points]
      operationId: recordCompletion
      security: [{ firebaseBearer: [] }]
      parameters:
        [
          {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema:
              { type: string, maxLength: 200, pattern: "^[A-Za-z0-9:_-]+$" },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Completion" } },
            },
        }
      responses:
        "201": { description: Immutable ledger entry created }
        "200": { description: Existing entry returned for duplicate key }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
components:
  securitySchemes:
    {
      firebaseBearer:
        { type: http, scheme: bearer, bearerFormat: Firebase ID token },
    }
  responses:
    Unauthorized:
      {
        description: Authentication required,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Forbidden:
      {
        description: Resource access denied,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    NotFound:
      {
        description: Not found,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Validation:
      {
        description: Validation failed,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    RateLimited:
      {
        description: Too many attempts,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Internal:
      {
        description: Unexpected server error,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
  schemas:
    Health:
      {
        type: object,
        required: [status, environment],
        properties:
          {
            status: { type: string, const: ok },
            environment: { type: string },
          },
      }
    Error:
      {
        type: object,
        required: [code, message, requestId],
        properties:
          {
            code: { type: string },
            message: { type: string },
            details: {},
            requestId: { type: string },
            error:
              {
                deprecated: true,
                type: object,
                required: [code, message, requestId],
                properties:
                  {
                    code: { type: string },
                    message: { type: string },
                    requestId: { type: string },
                  },
              },
          },
      }
    AuthSessionResponse:
      {
        type: object,
        required: [data],
        properties:
          {
            data:
              {
                type: object,
                required:
                  [
                    uid,
                    email,
                    displayName,
                    roles,
                    disabled,
                    onboardingStatus,
                    memberships,
                  ],
                properties:
                  {
                    uid: { type: string },
                    email: { type: [string, "null"] },
                    displayName: { type: string },
                    roles:
                      {
                        type: array,
                        items:
                          {
                            type: string,
                            enum:
                              [
                                child,
                                parent,
                                mentor,
                                observer,
                                admin,
                                super_admin,
                              ],
                          },
                      },
                    disabled: { type: boolean },
                    onboardingStatus:
                      {
                        type: string,
                        enum:
                          [
                            complete,
                            role_required,
                            profile_required,
                            pending_approval,
                          ],
                      },
                    memberships:
                      {
                        type: array,
                        items:
                          {
                            type: object,
                            required: [organizationId, roles, status],
                            properties:
                              {
                                organizationId: { type: string },
                                roles:
                                  {
                                    type: array,
                                    items:
                                      {
                                        type: string,
                                        enum:
                                          [
                                            child,
                                            parent,
                                            mentor,
                                            observer,
                                            admin,
                                            super_admin,
                                          ],
                                      },
                                  },
                                status:
                                  {
                                    type: string,
                                    enum: [active, pending, suspended],
                                  },
                              },
                          },
                      },
                  },
              },
          },
      }
    ChildTokenRequest:
      {
        type: object,
        additionalProperties: false,
        required: [familyCode, handle, pin],
        properties:
          {
            familyCode: { type: string },
            handle: { type: string },
            pin:
              { type: string, format: password, minLength: 4, maxLength: 128 },
          },
      }
    ChildTokenResponse:
      {
        type: object,
        required: [data],
        properties:
          {
            data:
              {
                type: object,
                required: [customToken],
                properties: { customToken: { type: string } },
              },
          },
      }
    Completion:
      {
        type: object,
        additionalProperties: false,
        required:
          [
            participantId,
            teamId,
            quarterId,
            sourceType,
            sourceId,
            reason,
            occurredAt,
          ],
        properties:
          {
            participantId: { type: string },
            teamId: { type: string },
            quarterId: { type: string },
            sourceType:
              {
                type: string,
                enum:
                  [
                    daily_checkin,
                    gratitude,
                    character_assessment,
                    bible_activity,
                    family_activity,
                    reading,
                    project_milestone,
                    academic_session,
                    character_observation_bonus,
                  ],
              },
            sourceId: { type: string },
            reason: { type: string },
            occurredAt: { type: string, format: date-time },
          },
      }
